<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title">
<title id="title">Umbra — testes de reprodução do limiar</title>
<defs><g id="symbol"><path d="M24 20V72Q24 108 60 108H100L148 44" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"/></g><filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter><clipPath id="partial"><rect width="112" height="132"/></clipPath></defs>
<rect width="1200" height="850" fill="#111111"/>
<g fill="#E6E6E6" font-family="DejaVu Sans, sans-serif" font-size="16">
<text x="48" y="56" letter-spacing="3">UMBRA / PROVAS DE REPRODUÇÃO</text>
<rect x="48" y="95" width="340" height="270" fill="#000000"/><use href="#symbol" transform="translate(104 140) scale(1.5)" color="#E6E6E6"/>
<rect x="430" y="95" width="340" height="270" fill="#E6E6E6"/><use href="#symbol" transform="translate(486 140) scale(1.5)" color="#000000"/>
<use href="#symbol" transform="translate(872 140) scale(1.5)" color="#E6E6E6" filter="url(#blur)"/>
<text x="48" y="400">Monocromia</text><text x="430" y="400">Inversão / silhueta</text><text x="830" y="400">Desfoque</text>
<text x="48" y="480">Largura real: 16 / 24 / 32 / 64 / 128 px</text>
<use href="#symbol" transform="translate(48 520) scale(.093023)" color="#E6E6E6"/><use href="#symbol" transform="translate(100 520) scale(.139535)" color="#E6E6E6"/><use href="#symbol" transform="translate(166 520) scale(.186047)" color="#E6E6E6"/><use href="#symbol" transform="translate(240 520) scale(.372093)" color="#E6E6E6"/><use href="#symbol" transform="translate(360 520) scale(.744186)" color="#E6E6E6"/>
<use href="#symbol" transform="translate(840 460) scale(1.5)" color="#E6E6E6" clip-path="url(#partial)"/><text x="830" y="680">Oclusão: silhueta incompleta.</text>
<text x="48" y="680">Preferir ≥ 32 px. Não recortar ou espelhar a marca.</text>
<text x="48" y="764" fill="#A8A8A8">A associação da silhueta à marca precisa de teste com pessoas.</text>
<text x="48" y="795" fill="#A8A8A8">As provas visuais não medem lembrança nem exclusividade.</text>
</g></svg>
