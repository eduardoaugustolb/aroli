<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580" role="img"><title>Umbra — testes de linguagem sem assinatura e troca de nome</title><rect width="1440" height="580" fill="#050505"/><text x="64" y="64" fill="#C5C7C5" font-family="DejaVu Sans,sans-serif" font-size="28">02 — A linguagem além do símbolo</text><text x="64" y="108" fill="#858A89" font-family="DejaVu Sans,sans-serif" font-size="18">Sem logo, nome ou slogan</text><text x="768" y="108" fill="#858A89" font-family="DejaVu Sans,sans-serif" font-size="18">Troca de nome / controle de distinção</text><rect x="64" y="140" width="600" height="320" fill="#101111"/><path d="M364 170V300Q364 386 434 386H544L628 268" fill="none" stroke="#292D2D" stroke-width="22"/><rect x="768" y="140" width="600" height="320" fill="#101111"/><path d="M1068 170V300Q1068 386 1138 386H1248L1332 268" fill="none" stroke="#292D2D" stroke-width="22"/><text x="796" y="230" fill="#C5C7C5" font-family="DejaVu Sans,sans-serif" font-size="44">nord</text><text x="64" y="506" fill="#858A89" font-family="DejaVu Sans,sans-serif" font-size="16">O contorno mantém parentesco com o wallpaper.</text><text x="768" y="506" fill="#858A89" font-family="DejaVu Sans,sans-serif" font-size="16">A troca ainda é plausível: exclusividade não comprovada.</text><text x="64" y="544" fill="#858A89" font-family="DejaVu Sans,sans-serif" font-size="16">O limiar pode organizar recortes e composições; associação à Umbra exige uso consistente.</text></svg>