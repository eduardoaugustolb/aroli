name: Cursor preview

on:
  push:
    paths:
      - "themes/cursor/aroli/**"
      - ".github/workflows/cursor-preview.yml"
  pull_request:
    paths:
      - "themes/cursor/aroli/**"
      - ".github/workflows/cursor-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    name: Verify cursor integrity and publish visual review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install cursor build dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick libxcursor-dev build-essential pkg-config
      - name: Verify generated anatomy and compiled cursors
        run: make -C themes/cursor/aroli check
      - name: Generate SVG preview
        run: bun themes/cursor/aroli/scripts/generate-preview.ts
      - name: Render visual review
        run: |
          bun themes/cursor/aroli/scripts/verify-cursors.ts /tmp/aroli-cursor-sheet.svg
          rsvg-convert /tmp/aroli-cursor-sheet.svg -o /tmp/aroli-cursor-sheet.png
          rsvg-convert themes/cursor/aroli/preview.svg -o /tmp/aroli-cursor-preview.png
          rsvg-convert themes/cursor/aroli/silhouettes.svg -o /tmp/aroli-silhouettes.png
      - name: Verify generated file is committed
        run: git diff --exit-code -- themes/cursor/aroli/preview.svg
      - name: Publish preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: aroli-cursor-preview
          path: |
            themes/cursor/aroli/preview.svg
            /tmp/aroli-cursor-sheet.svg
            /tmp/aroli-cursor-sheet.png
            /tmp/aroli-cursor-preview.png
            themes/cursor/aroli/silhouettes.svg
            /tmp/aroli-silhouettes.png
          if-no-files-found: error
